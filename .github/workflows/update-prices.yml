name: 自动更新价格数据

on:
  schedule:
    # 北京时间每天早上 9:00 (UTC+8 = 01:00 UTC)
    - cron: "0 1 * * *"
  workflow_dispatch:  # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许 push 回仓库

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install cloudscraper beautifulsoup4

      - name: 抓取价格数据
        run: python3 scrape_prices.py

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "📊 自动更新价格数据 $(date +'%Y-%m-%d')"
            git push
            echo "✅ 数据已更新并推送"
          fi
